name: CI Pipeline

on:
  push:
    branches: [ "main", "desafio-*", "feat/*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint-e-seguranca:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Brakeman
        # A integração mantém o runtime existente; atualizar Ruby/Rails é uma tarefa separada.
        run: bundle exec brakeman --no-pager --except EOLRuby,EOLRails

  testes:
    runs-on: ubuntu-latest
    services:
      rabbitmq:
        image: rabbitmq:4.2-management
        env:
          RABBITMQ_DEFAULT_USER: psiline
          RABBITMQ_DEFAULT_PASS: psiline_local
          RABBITMQ_DEFAULT_VHOST: psiline_test
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q check_running"
          --health-interval 5s
          --health-timeout 10s
          --health-retries 20
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      RAILS_ENV: test
      CI: "true"
      DATABASE_HOST: localhost
      DATABASE_PORT: 5432
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
      RABBITMQ_TEST_URL: amqp://psiline:psiline_local@localhost:5672/psiline_test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Preparar banco
        run: bin/rails db:prepare

      - name: Autoload
        run: bin/rails zeitwerk:check

      - name: RSpec
        run: bundle exec rspec

      - name: Tailwind
        run: bin/rails tailwindcss:build

      - name: Preparar banco isolado de triagem
        working-directory: services/triagem
        run: ruby bin/rails db:prepare

      - name: RSpec triagem
        working-directory: services/triagem
        run: bundle exec rspec spec

      - name: Validar Docker Compose
        run: docker compose config --quiet
