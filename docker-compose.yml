x-app: &app
  build: .
  image: psiline-rails:local
  init: true
  restart: unless-stopped

x-agendamento-env: &agendamento-env
  RAILS_ENV: development
  SERVICE_NAME: agendamento
  DATABASE_HOST: db
  DATABASE_USER: agendamento_psicologia
  DATABASE_PASSWORD: agendamento_psicologia
  DATABASE_NAME: ${DATABASE_NAME:-agendamento_psicologia_unificada_development}
  DATABASE_TEST_NAME: ${DATABASE_TEST_NAME:-agendamento_psicologia_unificada_test}
  RABBITMQ_URL: amqp://${RABBITMQ_USER:-psiline}:${RABBITMQ_PASSWORD:-psiline_local}@rabbitmq:5672/psiline

x-triagem-env: &triagem-env
  RAILS_ENV: development
  SERVICE_NAME: triagem
  DATABASE_HOST: triagem-db
  DATABASE_PORT: 5432
  DATABASE_USER: triagem
  DATABASE_PASSWORD: triagem
  DATABASE_NAME: psiline_triagem_development
  DATABASE_TEST_NAME: psiline_triagem_test
  RABBITMQ_URL: amqp://${RABBITMQ_USER:-psiline}:${RABBITMQ_PASSWORD:-psiline_local}@rabbitmq:5672/psiline

x-worker-health: &worker-health
  test: ["CMD", "ruby", "-e", "exit(File.exist?('tmp/outbox-heartbeat') && Time.now - File.mtime('tmp/outbox-heartbeat') < 120 ? 0 : 1)"]
  interval: 15s
  timeout: 5s
  start_period: 30s
  retries: 3

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: agendamento_psicologia
      POSTGRES_PASSWORD: agendamento_psicologia
      POSTGRES_DB: ${DATABASE_NAME:-agendamento_psicologia_unificada_development}
    ports:
      - "127.0.0.1:${AGENDAMENTO_DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agendamento_psicologia"]
      interval: 2s
      timeout: 3s
      retries: 30

  triagem-db:
    image: postgres:16
    environment:
      POSTGRES_USER: triagem
      POSTGRES_PASSWORD: triagem
      POSTGRES_DB: psiline_triagem_development
    volumes:
      - triagem_postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${TRIAGEM_DB_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U triagem -d psiline_triagem_development"]
      interval: 2s
      timeout: 3s
      retries: 30

  rabbitmq:
    image: rabbitmq:4.2-management
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-psiline}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-psiline_local}
      RABBITMQ_DEFAULT_VHOST: psiline
    ports:
      - "127.0.0.1:${RABBITMQ_PORT:-5672}:5672"
      - "127.0.0.1:${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 20s

  agendamento-setup:
    <<: *app
    restart: "no"
    environment: *agendamento-env
    depends_on:
      db:
        condition: service_healthy
    command: ["bin/rails", "db:prepare", "db:seed"]

  triagem-setup:
    <<: *app
    restart: "no"
    working_dir: /rails/services/triagem
    environment: *triagem-env
    depends_on:
      triagem-db:
        condition: service_healthy
    command: ["ruby", "bin/rails", "db:prepare"]

  messaging-setup:
    <<: *app
    restart: "no"
    environment: *agendamento-env
    depends_on:
      rabbitmq:
        condition: service_healthy
    command: ["bundle", "exec", "rake", "messaging:setup"]

  web:
    <<: *app
    environment: *agendamento-env
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    depends_on:
      agendamento-setup:
        condition: service_completed_successfully
    command: ["bash", "-c", "rm -f tmp/pids/server.pid && bin/rails tailwindcss:build && exec bin/rails server -b 0.0.0.0 -p 3000"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/ready"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  triagem:
    <<: *app
    working_dir: /rails/services/triagem
    environment: *triagem-env
    ports:
      - "127.0.0.1:${TRIAGEM_PORT:-3001}:3001"
    depends_on:
      triagem-setup:
        condition: service_completed_successfully
    command: ["ruby", "bin/rails", "server", "-b", "0.0.0.0", "-p", "3001"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3001/ready"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  agendamento-outbox:
    <<: *app
    environment: *agendamento-env
    depends_on:
      agendamento-setup:
        condition: service_completed_successfully
      messaging-setup:
        condition: service_completed_successfully
    command: ["bundle", "exec", "rake", "messaging:publish"]
    healthcheck: *worker-health

  triagem-outbox:
    <<: *app
    working_dir: /rails/services/triagem
    environment: *triagem-env
    depends_on:
      triagem-setup:
        condition: service_completed_successfully
      messaging-setup:
        condition: service_completed_successfully
    command: ["bundle", "exec", "rake", "messaging:publish"]
    healthcheck: *worker-health

volumes:
  postgres_data:
  triagem_postgres_data:
  rabbitmq_data:
