services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: agendamento_psicologia
      POSTGRES_PASSWORD: agendamento_psicologia
      POSTGRES_DB: agendamento_psicologia_development
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agendamento_psicologia -d agendamento_psicologia_development"]
      interval: 2s
      timeout: 3s
      retries: 30

  web:
    build: .
    init: true
    volumes:
      - .:/rails
      - bundle_data:/usr/local/bundle
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      RAILS_ENV: development
      DATABASE_HOST: db
      DATABASE_USER: agendamento_psicologia
      DATABASE_PASSWORD: agendamento_psicologia
      DATABASE_NAME: agendamento_psicologia_development
    command: >
      bash -lc "bundle install && rm -f tmp/pids/server.pid && bin/rails db:prepare db:seed && bin/rails tailwindcss:build && bin/rails server -b 0.0.0.0 -p 3000"

volumes:
  postgres_data:
  bundle_data:
