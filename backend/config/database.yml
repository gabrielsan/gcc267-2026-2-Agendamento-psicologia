# Configuração via variáveis de ambiente (o docker-compose.yml já define tudo).
# Também é possível usar DATABASE_URL, que tem prioridade sobre estes valores.
default: &default
  adapter: postgresql
  encoding: unicode
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  host: <%= ENV.fetch("DATABASE_HOST", "localhost") %>
  port: <%= ENV.fetch("DATABASE_PORT", 5432) %>
  username: <%= ENV.fetch("DATABASE_USERNAME", "postgres") %>
  password: <%= ENV.fetch("DATABASE_PASSWORD", "postgres") %>

development:
  <<: *default
  database: agendamento_development

test:
  <<: *default
  database: agendamento_test

production:
  <<: *default
  database: agendamento_production
